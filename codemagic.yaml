workflows:
  ios-vnc-simulator:
    name: Interactive VNC iOS Simulator (Test App live)
    instance_type: mac_mini_m1
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.kotizz.app"

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build iOS App for Simulator
        script: |
          flutter build ios --simulator --debug

      - name: Boot Simulator & Install Kotizz App
        script: |
          xcrun simctl boot "iPhone 15" || true
          open -a Simulator
          xcrun simctl install booted build/ios/iphonesimulator/Runner.app || true
          xcrun simctl launch booted "$BUNDLE_ID" || true

      - name: Setup VNC Workspace & Keep Alive for Testing
        script: |
          open $CM_BUILD_DIR/ios/Runner.xcworkspace
          echo "🚀 SIMULATOR & KOTIZZ APP READY: Connect via VNC in CodeMagic UI to test!"
          caffeinate -u -t 3600

  ios-release:
    name: Build & Sign iOS IPA (Kotizz App Store)
    instance_type: mac_mini_m1
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic pp Store Api key

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store # Options: app_store, ad_hoc, development
        bundle_identifier: com.kotizz.app
      vars:
        BUNDLE_ID: "com.kotizz.app"

    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build IPA for App Store
        script: |
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

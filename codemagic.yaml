workflows:
  ios-release:
    name: Build & Sign iOS IPA (Kotizz App Store)
    instance_type: mac_mini_m1
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic pp Store Api key

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store # Options: app_store, ad_hoc, development
        bundle_identifier: com.kotizz.app
      vars:
        BUNDLE_ID: "com.kotizz.app"

    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build IPA for App Store
        script: |
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-simulator:
    name: Build Flutter app on iOS simulator
    instance_type: mac_mini_m1
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.kotizz.app"

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build iOS App for Simulator
        script: |
          flutter build ios --simulator --debug

    artifacts:
      - build/ios/iphonesimulator/*.app

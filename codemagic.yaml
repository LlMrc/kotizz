workflows:
  ios-vnc-simulator:
    name: Interactive VNC iOS Simulator (Test App Live)
    instance_type: mac_mini_m1
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.kotizz.app"

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build iOS App for Simulator
        script: |
          flutter build ios --simulator --debug

      - name: Boot Simulator & Install Kotizz App
        script: |
          xcrun simctl boot "iPhone 15" || true
          open -a Simulator
          xcrun simctl install booted build/ios/iphonesimulator/Runner.app || true
          xcrun simctl launch booted "$BUNDLE_ID" || true

      - name: Setup VNC Workspace & Keep Alive for Testing
        script: |
          open $CM_BUILD_DIR/ios/Runner.xcworkspace
          echo "🚀 SIMULATOR & KOTIZZ APP READY: Connect via VNC in CodeMagic UI to test!"
          caffeinate -u -t 3600

    artifacts:
      - build/ios/iphonesimulator/*.app

  # ──────────────────────────────────────────────────────────────
  # iOS Distribution build — real device, push notifications enabled
  # Requires these env vars set in Codemagic dashboard (encrypted):
  #   APP_STORE_CONNECT_KEY_IDENTIFIER  → Your App Store Connect API key ID
  #   APP_STORE_CONNECT_ISSUER_ID       → Your App Store Connect issuer ID
  #   APP_STORE_CONNECT_PRIVATE_KEY     → Contents of your .p8 API key file
  #   CERTIFICATE_PRIVATE_KEY           → Contents of your signing certificate .p12
  # ──────────────────────────────────────────────────────────────
  ios-distribution:
    name: iOS Distribution (Push Notifications)
    instance_type: mac_mini_m1
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store        # or: ad_hoc, development
        bundle_identifier: com.kotizz.app
      vars:
        BUNDLE_ID: "com.kotizz.app"

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install

      - name: Set up code signing
        script: |
          # Codemagic's keychain tool — automatically installs cert + provisioning profile
          # The provisioning profile MUST have Push Notifications enabled in Apple Dev Portal
          keychain initialize
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build iOS release
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false   # set to true to auto-submit to TestFlight
